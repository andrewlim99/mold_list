<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="refresh" content="8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Mold Dashboard Updating</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f4f7fb; color: #172033; font: 16px/1.5 Arial, sans-serif; }
    main { width: min(440px, calc(100% - 48px)); padding: 36px; text-align: center; background: #fff; border: 1px solid #d8e0ec; border-radius: 14px; box-shadow: 0 12px 32px rgba(23,32,51,.12); }
    h1 { margin: 0 0 12px; font-size: 24px; }
    p { margin: 0; color: #526277; }
    .dots { margin: 22px auto 0; width: 42px; height: 10px; background: radial-gradient(circle at 5px 5px, #d71920 4px, transparent 4.5px) 0 0 / 18px 10px repeat-x; }
  </style>
</head>
<body>
  <main>
    <h1>Mold Dashboard is updating</h1>
    <p>Please wait a moment. This page refreshes automatically when the system is ready.</p>
    <div class="dots" aria-hidden="true"></div>
  </main>
</body>
</html>
