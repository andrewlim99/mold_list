# Install as /etc/nginx/sites-available/mold-dashboard, then enable it.
# Nginx is the only process exposed to the LAN.  The PowerShell application
# server remains bound to 127.0.0.1:3212.
server {
    listen 80;
    # Add a matching internal-DNS/hosts record before enabling this site.
    server_name mold.internal;

    # PDF uploads are Base64-encoded by the browser, so permit more than the
    # source PDF's maximum size.
    client_max_body_size 35m;

    # Keep a friendly page available while the application service is being
    # restarted for an approved release (or if it is temporarily unavailable).
    proxy_intercept_errors on;
    error_page 502 503 504 = /_mold-maintenance.html;

    location = /_mold-maintenance.html {
        internal;
        root /var/www/mold-dashboard;
        add_header Cache-Control "no-store" always;
    }

    location / {
        proxy_pass http://127.0.0.1:3212;
        proxy_http_version 1.1;
        # HttpListener is bound to the loopback prefix, so retain the
        # loopback Host header for the upstream request.
        proxy_set_header Host 127.0.0.1:3212;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
    }
}
